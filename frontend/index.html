<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Túneles</title>

    <!-- Materialize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="blue darken-2">
      <div class="nav-wrapper" style="padding: 0 15px;">
        <a href="#" class="brand-logo" style="margin-left: 0;">Dashboard Túneles</a>
      </div>
    </nav>

    <!-- Layout principal -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar z-depth-2">
        <h6>Filtros</h6>

        <div class="row">
          <div class="input-field col s12">
            <select id="packing">
              <option value="" disabled selected>Seleccione packing</option>
            </select>
            <label>Packing</label>
          </div>

          <div class="input-field col s12">
            <select id="temporada" disabled>
              <option value="" disabled selected>Seleccione temporada</option>
            </select>
            <label>Temporada</label>
          </div>

          <div class="input-field col s12">
            <select id="fruta" disabled>
              <option value="" disabled selected>Seleccione fruta</option>
            </select>
            <label>Fruta</label>
          </div>
        </div>

        <button
          class="btn waves-effect waves-light blue"
          onclick="cargarDatos()"
        >
          Buscar
        </button>
      </aside>

      <!-- Área principal -->
      <main class="dashboard-grid">
        <!-- CARD 1: Procesos por tipo de túnel -->
        <div class="widget card kpi">
          <div class="kpi-top">
            <div>
              <div class="kpi-title">Procesos (cerrados)</div>
              <div class="kpi-value">128</div>
            </div>
            <div class="kpi-badge">Total</div>
          </div>
          <div class="kpi-divider"></div>
          <div class="kpi-subgrid">
            <div class="kpi-sub">
              <div class="kpi-sub-label">Materia prima</div>
              <div class="kpi-sub-value">74</div>
            </div>
            <div class="kpi-sub">
              <div class="kpi-sub-label">Producto terminado</div>
              <div class="kpi-sub-value">54</div>
            </div>
          </div>
        </div>

        <!-- CARD 2: Tiempo promedio por túnel -->
        <div class="widget card kpi">
          <div class="kpi-top">
            <div>
              <div class="kpi-title">Tiempo de enfriamiento</div>
              <div class="kpi-value">4.2 <span class="kpi-unit">h</span></div>
            </div>
            <div class="kpi-badge">Promedio</div>
          </div>
          <div class="kpi-divider"></div>
          <div class="kpi-subgrid">
            <div class="kpi-sub">
              <div class="kpi-sub-label">Materia prima</div>
              <div class="kpi-sub-value">4.8 h</div>
            </div>
            <div class="kpi-sub">
              <div class="kpi-sub-label">Producto terminado</div>
              <div class="kpi-sub-value">3.6 h</div>
            </div>
          </div>
        </div>

        <!-- CARD 3: Incidentes totales -->
        <div class="widget card kpi">
          <div class="kpi-top">
            <div>
              <div class="kpi-title">Incidentes totales</div>
              <div class="kpi-value">9</div>
            </div>
            <div class="kpi-badge danger">Alerta</div>
          </div>
          <div class="kpi-divider"></div>
          <div class="kpi-chips">
            <div class="chip-dark">PK1_T01 <span>4</span></div>
            <div class="chip-dark">PK1_T03 <span>3</span></div>
            <div class="chip-dark">PK2_T02 <span>2</span></div>
          </div>
        </div>

        <div class="widget card chart-card">
          <div class="kpi-chart">
            <canvas id="chartTiempoTunelMix"></canvas>
          </div>
        </div>


        <div class="widget card chart-card">
          <div class="kpi-chart">
            <canvas id="chartAsentamientoTop5Grupos"></canvas>
          </div>
        </div>

        <div class="widget card chart-card">
          <div class="kpi-chart">
            <canvas id="chartPaletsDia"></canvas>
          </div>
        </div>



        <!-- TABLA DE DATOS OPERATIVOS DETALLADOS -->
        <div class="widget card data-table-card">
          <div class="table-header">
            <h3 class="table-title">Datos Operativos Detallados</h3>
            <div class="table-actions">
              <button class="table-btn" onclick="exportTableData()">Exportar</button>
            </div>
          </div>
          <div class="table-container" id="operationalTable">
            <!-- Tabla generada dinámicamente -->
          </div>
        </div>
      </main>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- Chart.js + Boxplot -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.5/build/index.umd.min.js"></script>

    <!-- Custom JS -->
    <script src="./js/apicall.js"></script>
    <script src="./js/graficas.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
