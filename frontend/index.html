<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Túneles</title>

  <!-- Materialize -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="blue darken-2">
    <div class="nav-wrapper">
      <a href="#" class="brand-logo" style="margin-left:15px;">Dashboard Túneles</a>
    </div>
  </nav>

  <!-- Layout principal -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar z-depth-2">
      <h6>Filtros</h6>

  

      <div class="row">
        <div class="col s12">
          <div class="input-field">
            <input type="text" class="datepicker" id="fechaDesde">
            <label for="fechaDesde">Desde</label>
          </div>
        </div>

        <div class="col s12">
          <div class="input-field">
            <input type="text" class="datepicker" id="fechaHasta">
            <label for="fechaHasta">Hasta</label>
          </div>
        </div>
      </div>


      <div class="row">

        <div class="col s12">
          <div class="input-field">
            <select name="" id="">
              <option value="1">UVA</option>
            </select>
          </div>
          <label>Temporada</label>
        </div>

      </div>
      
    </aside>

    <!-- Área principal -->
    <main class="dashboard-grid">

      <!-- Ejemplo de widgets -->
      <div class="widget card">Widget 1</div>
      <div class="widget card">Widget 2</div>
      <div class="widget card">Widget 3</div>
      <div class="widget card">Widget 4</div>

    </main>

  </div>

  <!-- Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
