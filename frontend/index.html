<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Túneles</title>

    <!-- Materialize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="blue darken-2">
      <div class="nav-wrapper">
        <a href="#" class="brand-logo" style="margin-left: 15px"
          >Dashboard Túneles</a
        >
      </div>
    </nav>

    <!-- Layout principal -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar z-depth-2">
        <h6>Filtros</h6>

        <div class="row">
          <div class="col s12">
            <div class="input-field">
              <input type="text" class="datepicker" id="fechaDesde" />
              <label for="fechaDesde">Desde</label>
            </div>
          </div>

          <div class="col s12">
            <div class="input-field">
              <input type="text" class="datepicker" id="fechaHasta" />
              <label for="fechaHasta">Hasta</label>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12">
            <select id="temporada">
            </select>
            <label>Temporada</label>
          </div>

          <div class="input-field col s12">
            <select id="fruta">
              <option value="" disabled selected>Seleccione fruta</option>
              <option value="mora">Mora</option>
              <option value="uva">Uva</option>
              <option value="mixto">Mixto</option>
            </select>
            <label>Fruta</label>
          </div>

          <div class="input-field col s12">
            <select id="packing">
              <option value="" disabled selected>Seleccione packing</option>
            </select>
            <label>Packing</label>
          </div>
        </div>

        <button class="btn waves-effect waves-light blue" onclick="cargarDatos()">Buscar</button>
      </aside>

      <!-- Área principal -->
      <main class="dashboard-grid">
        <!-- Ejemplo de widgets -->
        <div class="widget card">Widget 1</div>
        <div class="widget card">Widget 2</div>
        <div class="widget card">Widget 3</div>
        <div class="widget card">Widget 4</div>
      </main>
    </div>

    <!-- Materialize JS (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!--Api call python-->

    <script src="js/apicall.js"></script>

    <!-- Custom JS -->
    <script src="js/script.js"></script>

    <script>
      async function cargarTemporadas() {
        const temporadas = await getTemporadas();
        const select = document.getElementById('temporada');
        temporadas.forEach(t => {
          const option = document.createElement('option');
          option.value = t;
          option.textContent = t;
          select.appendChild(option);
        });
        M.FormSelect.init(document.querySelectorAll('select'));
      }

      document.getElementById('temporada').addEventListener('change', async function() {
        const temporada = this.value;
        const fruta = document.getElementById('fruta').value;
        if (fruta) {
          await cargarPackings(temporada, fruta);
        }
      });

      document.getElementById('fruta').addEventListener('change', async function() {
        const temporada = document.getElementById('temporada').value;
        const fruta = this.value;
        if (temporada) {
          await cargarPackings(temporada, fruta);
        }
      });

      async function cargarPackings(temporada, fruta) {
        const packings = await getPackings(temporada, fruta);
        const select = document.getElementById('packing');
        select.innerHTML = '<option value="" disabled selected>Seleccione packing</option>';
        packings.forEach(p => {
          const option = document.createElement('option');
          option.value = p;
          option.textContent = p;
          select.appendChild(option);
        });
        M.FormSelect.init(select);
      }

      function cargarDatos() {
        const temporada = document.getElementById('temporada').value;
        getDataTuneles(null, null, temporada, 10, 0);
      }

      cargarTemporadas();
    </script>
  </body>
</html>
