<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Túneles</title>

    <!-- Materialize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="blue darken-2">
      <div class="nav-wrapper">
        <a href="#" class="brand-logo" style="margin-left: 15px"
          >Dashboard Túneles</a
        >
      </div>
    </nav>

    <!-- Layout principal -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar z-depth-2">
        <h6>Filtros</h6>

        <!--div class="row">
          <div class="col s12">
            <div class="input-field">
              <input type="text" class="datepicker" id="fechaDesde" />
              <label for="fechaDesde">Desde</label>
            </div>
          </div>

          <div class="col s12">
            <div class="input-field">
              <input type="text" class="datepicker" id="fechaHasta" />
              <label for="fechaHasta">Hasta</label>
            </div>
          </div>
        </!--div-->

        <div class="row">
          <div class="input-field col s12">
            <select id="packing">
              <option value="" disabled selected>Seleccione packing</option>
            </select>
            <label>Packing</label>
          </div>

          <div class="input-field col s12">
            <select id="temporada" disabled>
              <option value="" disabled selected>Seleccione temporada</option>
            </select>
            <label>Temporada</label>
          </div>

          <div class="input-field col s12">
            <select id="fruta" disabled>
              <option value="" disabled selected>Seleccione fruta</option>
            </select>
            <label>Fruta</label>
          </div>
        </div>

        <button class="btn waves-effect waves-light blue" onclick="cargarDatos()">Buscar</button>
      </aside>

      <!-- Área principal -->
      <main class="dashboard-grid">
        <div class="widget card" style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
          <h5 style="margin: 0 0 10px 0; color: #1976d2; font-weight: 300;">Nº Procesos</h5>
          <h2 id="nProcesos" style="margin: 0 0 20px 0; font-size: 3em; font-weight: 700;">-</h2>
          <div id="tipoProceso" style="text-align: center; color: #666; font-size: 1.2em; line-height: 1.8;">-</div>
        </div>
        <div class="widget card" style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
          <h5 style="margin: 0 0 10px 0; color: #1976d2; font-weight: 300;">Masa Procesada</h5>
          <h2 id="toneladas" style="margin: 0 0 20px 0; font-size: 3em; font-weight: 700;">-</h2>
          <div id="tipoCaja" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; color: #666; font-size: 1.2em;">-</div>
        </div>
        <div class="widget card">Widget 3</div>
        <div class="widget card">Widget 4</div>
        <div class="widget card">Widget 5</div>
        <div class="widget card">Widget 6</div>
        <div class="widget card" style="position: relative; height: 400px;">
          <canvas id="performanceChart"></canvas>
        </div>
        <div class="widget card">Widget 8</div>
      </main>
    </div>

    <!-- Materialize JS (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--Api call python-->
    <script src="./js/apicall.js"></script>

    <!-- Widgets JS -->
    <script src="./js/widgets.js"></script>

    <!-- Chart JS -->
    <script src="./js/chart.js"></script>

    <!-- Custom JS -->
    <script src="./js/script.js"></script>
  </body>
</html>
